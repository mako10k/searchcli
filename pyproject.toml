[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searchcli"
version = "0.1.1"
description = "Structured multi-provider web search CLI for automation workflows"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "search", "cli", "ai", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "mcp>=1.27,<2",
  "platformdirs>=4,<5",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/mako10k/searchcli"
Repository = "https://github.com/mako10k/searchcli"
Issues = "https://github.com/mako10k/searchcli/issues"
Documentation = "https://github.com/mako10k/searchcli#readme"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
searchcli = "searchcli.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
